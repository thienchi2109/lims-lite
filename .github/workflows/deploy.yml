name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key and strip any Windows line endings
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Debug: show key structure (not content)
          echo "=== Key file check ==="
          ls -la ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key

          # Add host to known hosts
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # Start ssh-agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          echo "=== Starting deployment at $(date) ==="

          cd ~/lims-lite || { echo "ERROR: Cannot cd to ~/lims-lite"; exit 1; }
          echo "Working directory: $(pwd)"

          echo "=== Pulling latest code ==="
          git pull origin main || { echo "ERROR: Git pull failed"; exit 1; }
          git log -1 --oneline

          echo "=== Verifying .env file ==="
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found!"
            exit 1
          fi
          echo ".env file exists"

          echo "=== Building containers ==="
          docker compose build --no-cache app || { echo "ERROR: Docker build failed"; docker compose logs app; exit 1; }

          echo "=== Starting services ==="
          docker compose up -d || { echo "ERROR: Docker compose up failed"; docker compose logs; exit 1; }

          echo "=== Waiting for services ==="
          sleep 15

          echo "=== Container status ==="
          docker compose ps

          if docker compose ps | grep -iE "unhealthy|exited|restarting"; then
            echo "WARNING: Some containers are unhealthy"
            docker compose logs --tail=50
          fi

          echo "=== Cleaning up ==="
          docker system prune -f

          echo "=== Deployment completed at $(date) ==="
          ENDSSH
