events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimization
    sendfile        on;
    keepalive_timeout  65;
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-IP rate limits for public Supabase API paths
    # - auth endpoints: stricter to reduce brute-force/credential stuffing
    # - rest/storage/realtime: broader baseline abuse control
    limit_req_zone $binary_remote_addr zone=supabase_auth_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=supabase_api_per_ip:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=supabase_conn_per_ip:10m;
    limit_req_status 429;

    server {
        listen 80;

        # Stricter limit for auth actions exposed publicly.
        location ~ ^/auth/v1/(token|signup|verify|recover|otp|magiclink|invite) {
            limit_req zone=supabase_auth_per_ip burst=20 nodelay;
            limit_conn supabase_conn_per_ip 20;

            set $kong_upstream http://kong:8000;
            proxy_pass $kong_upstream;

            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Proxy Supabase API paths to Kong:
        # /auth/v1, /rest/v1, /storage/v1, /realtime/v1
        location ~ ^/(auth|rest|storage|realtime)/ {
            limit_req zone=supabase_api_per_ip burst=120 nodelay;
            limit_conn supabase_conn_per_ip 60;

            set $kong_upstream http://kong:8000;
            proxy_pass $kong_upstream;

            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Proxy everything else to Next.js App
        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
