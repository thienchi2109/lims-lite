services:
  postgres:
    image: supabase/postgres:15.1.1.28@sha256:33b96010b760e41a987542c8c043369022a16b16cd88941790d5fcf06cd2484c
    container_name: lims-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    image: supabase/gotrue:v2.143.0@sha256:f0a7d58bdae384cff916206a8a86e3d370b89b8a99c97ac91a3711169791554e
    container_name: lims-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_REFRESH_TOKEN_EXPIRY: ${GOTRUE_REFRESH_TOKEN_EXPIRY:-14400}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Keep email/password login enabled; GOTRUE_DISABLE_SIGNUP controls new account creation.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_PROVIDER:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
    ports:
      - "127.0.0.1:9999:9999"

  rest:
    image: postgrest/postgrest:v12.0.2@sha256:79369c0cdf9d7112ed4e327bc1b80156be11575dd66fbda245077a2d13b803bc
    container_name: lims-rest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      - "127.0.0.1:3001:3000"

  storage:
    image: supabase/storage-api:v0.46.4@sha256:3aed9cc6df7c0e8060d1bf7dafc15edb085e68cc158a3dbe966be6ca5ac0d726
    container_name: lims-storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres?search_path=storage,public
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage-data:/var/lib/storage
    ports:
      - "127.0.0.1:5000:5000"

  realtime:
    image: supabase/realtime:v2.33.66@sha256:01bb0007a31c9c069a3ef62a39977ed8c231e7685cea61f0d2c250b4e94715ae
    container_name: lims-realtime
    restart: unless-stopped
    # Compatibility note: default seccomp profile crashes in current VPS runtime.
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Supabase Realtime is multi-tenant and requires a seeded tenant.
      # The built-in seed uses external_id "realtime-dev", so APP_NAME must match.
      APP_NAME: realtime-dev
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: postgres
      DB_SSL: "false"
      # Required for auth + tenant seeding
      API_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Required for encrypting tenant secrets in Postgres (must be 16 bytes for aes_128_ecb)
      DB_ENC_KEY: ${DB_ENC_KEY:?DB_ENC_KEY is required}
      SEED_SELF_HOST: "true"
      REGION: us-east-1
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: 100000
    ports:
      - "127.0.0.1:4000:4000"

  kong:
    image: kong:2.8.1@sha256:1b53405d8680a09d6f44494b7990bf7da2ea43f84a258c59717d4539abf09f6d
    container_name: lims-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
      - realtime
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    healthcheck:
      test: [ "CMD-SHELL", "kong health" ]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro

  meta:
    image: supabase/postgres-meta:v0.84.2@sha256:d0a96973e9f1b6303f7500421a459af3d7273b3f9f1db38610899f9f573da7c7
    container_name: lims-meta
    restart: unless-stopped
    # Compatibility note: default seccomp profile crashes in current VPS runtime.
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:8080:8080"

  studio:
    image: supabase/studio@sha256:5f7a6900725d658edddf1b7639826be7d5369559751c9e9b020d128f0f060b42
    container_name: lims-studio
    restart: unless-stopped
    # Compatibility note: default seccomp profile crashes in current VPS runtime.
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      # Direct Postgres connection for Studio
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER_READ_WRITE: postgres
      POSTGRES_USER_READ_ONLY: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres
      PG_META_URL: http://meta:8080
      STUDIO_PG_META_URL: http://meta:8080
      HOST: 0.0.0.0
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"const host=process.env.HOSTNAME||'localhost';fetch('http://'+host+':3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:3002:3000"

  gotenberg:
    build:
      context: ./ops/gotenberg
      dockerfile: Dockerfile
    container_name: lims-gotenberg
    restart: unless-stopped
    environment:
      API_DISABLE_DOWNLOAD_FROM: "true"
      API_TIMEOUT: 30s
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_MAX_CONCURRENCY: "2"
      CHROMIUM_MAX_QUEUE_SIZE: "4"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:3000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2.0
    pids_limit: 256
    shm_size: 256m
    stop_grace_period: 30s
    networks:
      - pdf-upstream

  pdf-gateway:
    build:
      context: ./ops/pdf-gateway
      dockerfile: Dockerfile
    container_name: lims-pdf-gateway
    init: true
    restart: unless-stopped
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      PDF_GATEWAY_CLIENT_POLICY_FILE: /run/secrets/pdf_gateway_client_policy
      PORT: "8080"
    secrets:
      - source: pdf_gateway_client_policy
        target: pdf_gateway_client_policy
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const socket=net.connect(process.env.PORT||8080,'127.0.0.1');const fail=()=>process.exit(1);socket.setTimeout(5000);socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('timeout',fail);socket.on('error',fail)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s
    networks:
      - pdf-client
      - pdf-upstream

  approval-batch-worker:
    profiles:
      - approval-batch-worker
    build:
      context: .
      dockerfile: ops/approval-batch-worker/Dockerfile
    container_name: lims-approval-batch-worker
    init: true
    restart: unless-stopped
    environment:
      APPROVAL_BATCH_WORKER_DATABASE_HOST: postgres
      APPROVAL_BATCH_WORKER_DATABASE_NAME: postgres
      APPROVAL_BATCH_WORKER_DATABASE_PORT: "5432"
      APPROVAL_BATCH_WORKER_DATABASE_USER: approval_batch_worker
      APPROVAL_BATCH_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/approval_batch_worker_database_password
      APPROVAL_BATCH_WORKER_CONCURRENCY: "${APPROVAL_BATCH_WORKER_CONCURRENCY:-8}"
      APPROVAL_BATCH_WORKER_CLAIM_LEASE_SECONDS: "${APPROVAL_BATCH_WORKER_CLAIM_LEASE_SECONDS:-60}"
      APPROVAL_BATCH_WORKER_DRAIN_TIMEOUT_MS: "${APPROVAL_BATCH_WORKER_DRAIN_TIMEOUT_MS:-25000}"
      APPROVAL_BATCH_WORKER_HEALTH_HOST: 0.0.0.0
      APPROVAL_BATCH_WORKER_HEALTH_PORT: "${APPROVAL_BATCH_WORKER_HEALTH_PORT:-8081}"
    secrets:
      - source: approval_batch_worker_database_password
        target: approval_batch_worker_database_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const http=require('node:http');const request=http.get({host:'127.0.0.1',port:process.env.APPROVAL_BATCH_WORKER_HEALTH_PORT||8081,path:'/ready',timeout:4000},response=>{response.resume();process.exit(response.statusCode===200?0:1)});const fail=()=>process.exit(1);request.on('error',fail);request.on('timeout',()=>{request.destroy();fail()})
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s

  app:
    container_name: lims-app
    build:
      context: .
      target: runner
      args:
        # Empty URL forces client to use window.location.origin (Tunnel URL)
        NEXT_PUBLIC_SUPABASE_URL: ""
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
    init: true
    restart: unless-stopped
    environment:
      # Internal URL for Server Actions/SSR
      SUPABASE_INTERNAL_URL: http://kong:8000
      # Internal URL for on-demand CoA PDF conversion
      GOTENBERG_URL: ${GOTENBERG_URL:-http://pdf-gateway:8080}
      VIETNAMESE_ADDRESS_SERVICE_URL: "${VIETNAMESE_ADDRESS_SERVICE_URL:-}"
      VIETNAMESE_ADDRESS_SERVICE_TIMEOUT_MS: "${VIETNAMESE_ADDRESS_SERVICE_TIMEOUT_MS:-1500}"
      CLIENT_RESOLUTION_SHADOW_CATEGORIES: "${CLIENT_RESOLUTION_SHADOW_CATEGORIES:-off}"
      CLIENT_RESOLUTION_SHADOW_TIMEOUT_MS: "${CLIENT_RESOLUTION_SHADOW_TIMEOUT_MS:-500}"
      PDF_GATEWAY_TOKEN_FILE: /run/secrets/pdf_gateway_lims_token
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      # Service role key for admin operations (session invalidation, etc.)
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      # JWT secret for token signing/verification (CoA access, etc.)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Manager email OTP step-up configuration
      MANAGER_EMAIL_OTP_ENABLED: "${MANAGER_EMAIL_OTP_ENABLED:-FALSE}"
      MANAGER_HIV_EMAIL_OTP_ENABLED: "${MANAGER_HIV_EMAIL_OTP_ENABLED:-FALSE}"
      ANALYST_HIV_EMAIL_OTP_ENABLED: "${ANALYST_HIV_EMAIL_OTP_ENABLED:-FALSE}"
      MANAGER_OTP_EMAIL_PROVIDER: "${MANAGER_OTP_EMAIL_PROVIDER:-noop}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MANAGER_OTP_EMAIL_FROM: "${MANAGER_OTP_EMAIL_FROM:-}"
      MANAGER_OTP_EMAIL_REPLY_TO: "${MANAGER_OTP_EMAIL_REPLY_TO:-}"
    secrets:
      - source: pdf_gateway_lims_token
        target: pdf_gateway_lims_token
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const socket=net.connect(process.env.PORT||3000,'127.0.0.1');const fail=()=>process.exit(1);socket.setTimeout(5000);socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('timeout',fail);socket.on('error',fail)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    stop_grace_period: 30s
    networks:
      - default
      - pdf-client

  nginx:
    image: nginx@sha256:b0f7830b6bfaa1258f45d94c240ab668ced1b3651c8a222aefe6683447c7bf55
    container_name: lims-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks:
      - default

  tunnel:
    image: cloudflare/cloudflared@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: lims-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - default

volumes:
  postgres-data:
  storage-data:

networks:
  pdf-client:
    driver: bridge
    internal: true
  pdf-upstream:
    driver: bridge

secrets:
  approval_batch_worker_database_password:
    file: ${APPROVAL_BATCH_WORKER_DATABASE_PASSWORD_FILE:-/opt/lims-lite-secrets/approval-batch-worker-database-password}
  pdf_gateway_client_policy:
    file: ${PDF_GATEWAY_CLIENT_POLICY_FILE:?PDF_GATEWAY_CLIENT_POLICY_FILE is required}
  pdf_gateway_lims_token:
    file: ${PDF_GATEWAY_LIMS_TOKEN_FILE:?PDF_GATEWAY_LIMS_TOKEN_FILE is required}
