_format_version: "2.1"

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1
        strip_path: true

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1
        strip_path: true

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
        strip_path: true

  - name: realtime
    url: http://realtime:4000/socket
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1
        strip_path: true
    plugins:
      - name: cors
      # Realtime is multi-tenant and derives tenant external_id from the Host header.
      # Kong defaults to upstream Host ("realtime"), which causes TenantNotFound.
      # Force a stable tenant id that matches the built-in SEED_SELF_HOST tenant ("realtime-dev").
      - name: request-transformer
        config:
          replace:
            headers:
              - host:realtime-dev

plugins:
  - name: cors
    config:
      origins:
        - https://cdclims.cloud
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
        - x-supabase-api-version
        - accept-profile
        - content-profile
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
